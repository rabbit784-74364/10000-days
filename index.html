/* ============================================================
   RESET & BASE
   ============================================================ */

<script>
// ============================================================
// FIREWORKS SYSTEM (Canvas)
// ============================================================

const canvas = document.getElementById('fireworksCanvas');
const ctx = canvas.getContext('2d');

let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => {
  resize();
  // Re-create starfield on resize
  initStars();
});

// ---- Particle ----
class Particle {
  constructor(x, y, color, options = {}) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = (options.speed || 2) + Math.random() * (options.speedVar || 5);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.color = color;
    this.alpha = 1;
    this.size = options.size || (1.5 + Math.random() * 3);
    this.gravity = options.gravity || 0.04;
    this.fade = options.fade || (0.008 + Math.random() * 0.02);
    this.friction = options.friction || 0.985;
    // Sparkle trail
    this.trail = [];
    this.maxTrail = options.trail || 0;
    this.hue = options.hueShift || 0;
  }

  update() {
    // Save position for trail
    if (this.maxTrail > 0) {
      this.trail.push({ x: this.x, y: this.y, alpha: this.alpha });
      if (this.trail.length > this.maxTrail) this.trail.shift();
    }
    // Physics
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.fade;
    // Update trail alpha
    this.trail.forEach(t => t.alpha -= this.fade * 2);
  }

  draw(ctx) {
    // Draw trail
    if (this.maxTrail > 0) {
      this.trail.forEach(t => {
        if (t.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = t.alpha * 0.4;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(t.x, t.y, this.size * 0.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }
    // Draw main particle
    if (this.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = this.size * 2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  isDead() { return this.alpha <= 0; }
}

// ---- Firework (burst of particles) ----
class Firework {
  constructor(x, y, options = {}) {
    this.particles = [];
    const palette = options.palette || [
      '#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff',
      '#c06bff', '#ff9f43', '#00d2d3', '#ff6bff',
      '#ff8a5c', '#a29bfe', '#fd79a8', '#fdcb6e'
    ];
    const count = options.count || (80 + Math.floor(Math.random() * 60));
    const colors = [];
    // Pick 2-3 dominant colors for this burst
    const domCount = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < domCount; i++) {
      colors.push(palette[Math.floor(Math.random() * palette.length)]);
    }
    for (let i = 0; i < count; i++) {
      const color = colors[Math.floor(Math.random() * colors.length)];
      this.particles.push(new Particle(x, y, color, {
        speed: 3, speedVar: 7,
        size: 1.5 + Math.random() * 3.5,
        gravity: 0.05,
        fade: 0.006 + Math.random() * 0.018,
        trail: Math.random() > 0.5 ? 3 + Math.floor(Math.random() * 4) : 0,
      }));
    }
    // Inner bright core particles
    for (let i = 0; i < 20; i++) {
      const color = '#ffffff';
      this.particles.push(new Particle(x, y, color, {
        speed: 0.5, speedVar: 2,
        size: 0.8 + Math.random() * 1.5,
        gravity: 0.03,
        fade: 0.03 + Math.random() * 0.04,
        trail: 0,
      }));
    }
  }

  update() {
    this.particles = this.particles.filter(p => !p.isDead());
    this.particles.forEach(p => p.update());
  }

  draw(ctx) {
    this.particles.forEach(p => p.draw(ctx));
  }

  isDead() { return this.particles.length === 0; }
}

// ---- Fireworks Manager ----
const fireworks = [];

function spawnFirework(x, y) {
  fireworks.push(new Firework(x, y, { count: 100 + Math.floor(Math.random() * 80) }));
}

function animate() {
  requestAnimationFrame(animate);

  // Semi-transparent clear for trails
  ctx.fillStyle = 'rgba(5, 5, 16, 0.25)';
  ctx.fillRect(0, 0, W, H);

  // Update & draw meteors
  for (let i = meteors.length - 1; i >= 0; i--) {
    meteors[i].update();
    meteors[i].draw(ctx);
    if (meteors[i].isDead()) meteors.splice(i, 1);
  }

  // Update & draw fireworks
  for (let i = fireworks.length - 1; i >= 0; i--) {
    fireworks[i].update();
    fireworks[i].draw(ctx);
    if (fireworks[i].isDead()) fireworks.splice(i, 1);
  }
}

// ---- Click / Touch handler ----
function handleInteraction(e) {
  e.preventDefault();
  let x, y;
  if (e.touches) {
    x = e.touches[0].clientX;
    y = e.touches[0].clientY;
  } else {
    x = e.clientX;
    y = e.clientY;
  }
  // Spawn 1-3 fireworks at the click point
  const count = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++) {
    const ox = x + (Math.random() - 0.5) * 60;
    const oy = y + (Math.random() - 0.5) * 60;
    spawnFirework(ox, oy);
  }
}

document.addEventListener('click', handleInteraction);

  '第10000天，我终于学会了和世界温柔地相处',
  '这一万天，是一场漫长的自我编译',

let phraseIndex = 0;
let charIndex = 0;
let isDeleting = false;
let typeSpeed = 80;

function typeLoop() {
  const current = phrases[phraseIndex];

  if (!isDeleting) {
    // Typing
    typewriterEl.textContent = current.substring(0, charIndex);
    charIndex++;
    if (charIndex > current.length) {
      // Finished typing — pause then delete
      isDeleting = true;
      typeSpeed = 2000; // Pause at end
    } else {
      typeSpeed = 60 + Math.random() * 60;
    }
  } else {
    // Deleting
    typewriterEl.textContent = current.substring(0, charIndex);
    charIndex--;
    if (charIndex < 0) {
      // Finished deleting — move to next phrase
      isDeleting = false;
      charIndex = 0;
      phraseIndex = (phraseIndex + 1) % phrases.length;
      typeSpeed = 300;
    } else {
      typeSpeed = 30 + Math.random() * 20;
    }
  }

  setTimeout(typeLoop, typeSpeed);
}

// ============================================================
// MANIFEST LOADER — Images + Music
// ============================================================
let manifestData = { images: [], music: [] };

async function loadManifest() {
  try {
    const resp = await fetch('manifest.json');
    if (resp.ok) manifestData = await resp.json();
  } catch (e) {
    manifestData = { images: [], music: [] };
  }
  initBgCarousel(manifestData.images || []);
  initMusicPlayer(manifestData.music || []);
}

// ============================================================
// SLIDESHOW — Direct load from manifest, no probing
// ============================================================
function initBgCarousel(imageList) {
  const stage = document.getElementById('slideshowStage');
  const bgContainer = document.getElementById('bgCarousel');

  if (imageList.length === 0) return;

  // Directly use manifest URLs — encode Chinese filenames
  const images = imageList.map(f => {
    const path = f.startsWith('images/') ? f : `images/${f}`;
    // Split path and encode filename part for non-ASCII chars
    const parts = path.split('/');
    parts[parts.length - 1] = encodeURI(parts[parts.length - 1]);
    return parts.join('/');
  });

  let current = 0;

  // Create slides directly — browser loads them in parallel
  images.forEach((src, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide-img';
    if (i === 0) slide.classList.add('active');
    // Use CSS background-image so browser loads lazily
    slide.style.backgroundImage = `url(${src})`;
    stage.insertBefore(slide, stage.firstChild);

    const bgSlide = document.createElement('div');
    bgSlide.className = 'bg-slide';
    if (i === 0) bgSlide.classList.add('active');
    bgSlide.style.backgroundImage = `url(${src})`;
    bgContainer.appendChild(bgSlide);
  });

  const slides = stage.querySelectorAll('.slide-img');
  const bgSlides = bgContainer.querySelectorAll('.bg-slide');

  function nextSlide() {
    slides[current].classList.remove('active');
    bgSlides[current].classList.remove('active');
    bgSlides[current].classList.add('exit');
    current = (current + 1) % images.length;
    slides[current].classList.add('active');
    bgSlides[current].classList.remove('exit');
    bgSlides[current].classList.add('active');
  }

  if (images.length > 1) setInterval(nextSlide, 5000);
}

// ============================================================
// MUSIC PLAYER — Icon-only button
// ============================================================
function initMusicPlayer(musicList) {
  if (!musicList || musicList.length === 0) return;

  const btn = document.getElementById('musicBtn');
  if (!btn) return;

  let currentTrack = 0;
  let isPlaying = false;
  const audio = new Audio();
  audio.volume = 0.5;
  audio.preload = 'none'; // Don't preload — save bandwidth
  const playlist = musicList.map(f => f.startsWith('music/') ? f : `music/${f}`);

  function loadTrack(index) {
    audio.src = playlist[index];
    // Don't call audio.load() — let browser fetch on play()
  }

  function play() {
    audio.play().then(() => {
      isPlaying = true;
      btn.classList.add('playing');
    }).catch(() => {});
  }

  function pause() {
    audio.pause(); isPlaying = false;
    btn.classList.remove('playing');
  }

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    isPlaying ? pause() : play();
  });

  audio.addEventListener('ended', () => {
    currentTrack = (currentTrack + 1) % playlist.length;
    loadTrack(currentTrack); play();
  });

  audio.addEventListener('error', () => {
    setTimeout(() => { currentTrack = (currentTrack + 1) % playlist.length; loadTrack(currentTrack); play(); }, 2000);
  });

  loadTrack(0);

  // Auto-play on first user interaction
  let started = false;
  function tryStart() {
    if (started) return;
    audio.play().then(() => { started = true; isPlaying = true; btn.classList.add('playing'); }).catch(() => {});
  }
  document.addEventListener('click', tryStart);
  document.addEventListener('touchstart', tryStart);
}

// Kick off

})();

// ============================================================
// METEOR SHOWER — Enhanced Canvas Particle Meteors
// ============================================================
const meteors = [];

class CanvasMeteor {
  constructor(type) {
    this.type = type || (Math.random() > 0.5 ? 'fast' : 'slow');
    // Start from top area
    this.x = Math.random() * W * 1.1;
    this.y = -20 + Math.random() * H * 0.25;

    if (this.type === 'fast') {
      // Fast, long trail, bright
      const angle = Math.PI * 0.28 + Math.random() * 0.15; // 50-77 deg (down-right)
      const speed = 9 + Math.random() * 12;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.alpha = 0.9;
      this.size = 2 + Math.random() * 3;
      this.maxTrail = 20 + Math.floor(Math.random() * 15);
      this.maxLife = 60 + Math.random() * 40;
      this.hue = 210 + Math.random() * 40; // blue-white
    } else {
      // Slow, bright head, shorter trail
      const angle = Math.PI * 0.22 + Math.random() * 0.2; // 40-75 deg
      const speed = 4 + Math.random() * 6;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.alpha = 0.85;
      this.size = 2.5 + Math.random() * 4;
      this.maxTrail = 12 + Math.floor(Math.random() * 10);
      this.maxLife = 90 + Math.random() * 50;
      this.hue = 250 + Math.random() * 60; // purple-white
    }

    this.trail = [];
    this.life = 0;
    this.color = `hsla(${this.hue}, 70%, 85%, `;
    this.headColor = `hsla(${this.hue}, 15%, 95%, `;
  }

  update() {
    this.life++;
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.maxTrail) this.trail.shift();
    this.x += this.vx;
    this.y += this.vy;
    if (this.life > this.maxLife * 0.65) {
      this.alpha = Math.max(0, this.alpha - 0.025);
    }
  }

  draw(ctx) {
    if (this.alpha <= 0 || this.trail.length < 2) return;
    // Draw trail as gradient polyline
    for (let i = 0; i < this.trail.length - 1; i++) {
      const t = this.trail[i];
      const ratio = i / this.trail.length;
      ctx.save();
      ctx.globalAlpha = this.alpha * ratio * 0.65;
      ctx.strokeStyle = this.color + (ratio * 0.9) + ')';
      ctx.lineWidth = this.size * (0.3 + ratio * 0.7);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(t.x, t.y);
      const next = this.trail[i + 1];
      ctx.lineTo(next.x, next.y);
      ctx.stroke();
      ctx.restore();
    }
    // Head glow
    ctx.save();
    ctx.globalAlpha = this.alpha;
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 10);
    grad.addColorStop(0, this.headColor + '1)');
    grad.addColorStop(0.15, this.headColor + '0.7)');
    grad.addColorStop(0.5, this.headColor + '0.15)');
    grad.addColorStop(1, this.headColor + '0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 10, 0, Math.PI * 2);
    ctx.fill();
    // Bright white core
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  isDead() { return this.alpha <= 0 || this.x > W + 150 || this.y > H + 150 || this.x < -150; }
}

function spawnCanvasMeteor(type) {
  meteors.push(new CanvasMeteor(type));
}

// Initial burst
for (let i = 0; i < 6; i++) {
  setTimeout(() => spawnCanvasMeteor(), 300 + i * 350);
}

// Frequent meteors + periodic showers
(function scheduleMeteors() {
  const delay = 1000 + Math.random() * 2500;
  setTimeout(() => {
    const burst = Math.random() > 0.8 ? 2 + Math.floor(Math.random() * 3) : 1;
    for (let i = 0; i < burst; i++) {
      setTimeout(() => spawnCanvasMeteor(), i * 120);
    }
    scheduleMeteors();
  }, delay);
})();

// Meteor shower bursts every 12-20 seconds
(function scheduleShowers() {
  const delay = 12000 + Math.random() * 8000;
  setTimeout(() => {
    const count = 5 + Math.floor(Math.random() * 6);
    for (let i = 0; i < count; i++) {
      setTimeout(() => spawnCanvasMeteor(i % 2 === 0 ? 'fast' : 'slow'), i * 80 + Math.random() * 60);
    }
    scheduleShowers();
  }, delay);
})();

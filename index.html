<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

.bg-orb {

<script>
// ============================================================
// FIREWORKS SYSTEM
// ============================================================
const canvas = document.getElementById('fireworksCanvas');
const ctx = canvas.getContext('2d');
let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
});

class Particle {
  constructor(x, y, color, opts = {}) {
    this.x = x; this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = (opts.speed || 2) + Math.random() * (opts.speedVar || 5);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.color = color;
    this.alpha = 1;
    this.size = opts.size || (1.5 + Math.random() * 3);
    this.gravity = opts.gravity || 0.04;
    this.fade = opts.fade || (0.008 + Math.random() * 0.02);
    this.friction = opts.friction || 0.985;
    this.trail = [];
    this.maxTrail = opts.trail || 0;
  }
  update() {
    if (this.maxTrail > 0) {
      this.trail.push({ x: this.x, y: this.y, alpha: this.alpha });
      if (this.trail.length > this.maxTrail) this.trail.shift();
    }
    this.vx *= this.friction; this.vy *= this.friction;
    this.vy += this.gravity;
    this.x += this.vx; this.y += this.vy;
    this.alpha -= this.fade;
    this.trail.forEach(t => t.alpha -= this.fade * 2);
  }
  draw(ctx) {
    if (this.alpha <= 0) return;
    if (this.maxTrail > 0) {
      this.trail.forEach(t => {
        if (t.alpha <= 0) return;
        ctx.save(); ctx.globalAlpha = t.alpha * 0.4;
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(t.x, t.y, this.size * 0.6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });
    }
    ctx.save(); ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color; ctx.shadowBlur = this.size * 2;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  isDead() { return this.alpha <= 0; }
}

class Firework {
  constructor(x, y, opts = {}) {
    this.particles = [];
    const palette = opts.palette || ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c06bff','#ff9f43','#00d2d3','#ff6bff','#ff8a5c','#a29bfe','#fd79a8','#fdcb6e'];
    const count = opts.count || (80 + Math.floor(Math.random() * 60));
    const colors = [];
    for (let i = 0; i < 2 + Math.floor(Math.random() * 2); i++) colors.push(palette[Math.floor(Math.random() * palette.length)]);
    for (let i = 0; i < count; i++) {
      this.particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)], {
        speed: 3, speedVar: 7, size: 1.5 + Math.random() * 3.5, gravity: 0.05,
        fade: 0.006 + Math.random() * 0.018,
        trail: Math.random() > 0.5 ? 3 + Math.floor(Math.random() * 4) : 0,
      }));
    }
    for (let i = 0; i < 20; i++) {
      this.particles.push(new Particle(x, y, '#ffffff', {
        speed: 0.5, speedVar: 2, size: 0.8 + Math.random() * 1.5, gravity: 0.03,
        fade: 0.03 + Math.random() * 0.04, trail: 0,
      }));
    }
  }
  update() { this.particles = this.particles.filter(p => !p.isDead()); this.particles.forEach(p => p.update()); }
  draw(ctx) { this.particles.forEach(p => p.draw(ctx)); }
  isDead() { return this.particles.length === 0; }
}

const fireworks = [];
function spawnFirework(x, y) { fireworks.push(new Firework(x, y, { count: 100 + Math.floor(Math.random() * 80) })); }

// ============================================================
// METEOR SHOWER — Canvas Particles
// ============================================================
const meteors = [];
class CanvasMeteor {
  constructor(type) {
    this.type = type || (Math.random() > 0.5 ? 'fast' : 'slow');
    this.x = Math.random() * W * 1.1;
    this.y = -20 + Math.random() * H * 0.25;
    if (this.type === 'fast') {
      const angle = Math.PI * 0.28 + Math.random() * 0.15;
      const speed = 9 + Math.random() * 12;
      this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
      this.alpha = 0.9; this.size = 2 + Math.random() * 3;
      this.maxTrail = 20 + Math.floor(Math.random() * 15);
      this.maxLife = 60 + Math.random() * 40;
      this.hue = 210 + Math.random() * 40;
    } else {
      const angle = Math.PI * 0.22 + Math.random() * 0.2;
      const speed = 4 + Math.random() * 6;
      this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
      this.alpha = 0.85; this.size = 2.5 + Math.random() * 4;
      this.maxTrail = 12 + Math.floor(Math.random() * 10);
      this.maxLife = 90 + Math.random() * 50;
      this.hue = 250 + Math.random() * 60;
    }
    this.trail = []; this.life = 0;
    this.color = `hsla(${this.hue}, 70%, 85%, `;
    this.headColor = `hsla(${this.hue}, 15%, 95%, `;
  }
  update() {
    this.life++;
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.maxTrail) this.trail.shift();
    this.x += this.vx; this.y += this.vy;
    if (this.life > this.maxLife * 0.65) this.alpha = Math.max(0, this.alpha - 0.025);
  }
  draw(ctx) {
    if (this.alpha <= 0 || this.trail.length < 2) return;
    for (let i = 0; i < this.trail.length - 1; i++) {
      const t = this.trail[i], ratio = i / this.trail.length;
      ctx.save(); ctx.globalAlpha = this.alpha * ratio * 0.65;
      ctx.strokeStyle = this.color + (ratio * 0.9) + ')';
      ctx.lineWidth = this.size * (0.3 + ratio * 0.7); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(t.x, t.y);
      const next = this.trail[i + 1]; ctx.lineTo(next.x, next.y);
      ctx.stroke(); ctx.restore();
    }
    ctx.save(); ctx.globalAlpha = this.alpha;
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 10);
    grad.addColorStop(0, this.headColor + '1)');
    grad.addColorStop(0.15, this.headColor + '0.7)');
    grad.addColorStop(0.5, this.headColor + '0.15)');
    grad.addColorStop(1, this.headColor + '0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  isDead() { return this.alpha <= 0 || this.x > W + 150 || this.y > H + 150 || this.x < -150; }
}

function spawnMeteor(type) { meteors.push(new CanvasMeteor(type)); }

// ============================================================
// ANIMATION LOOP
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  ctx.fillStyle = 'rgba(5, 5, 16, 0.25)';
  ctx.fillRect(0, 0, W, H);
  for (let i = meteors.length - 1; i >= 0; i--) {
    meteors[i].update(); meteors[i].draw(ctx);
    if (meteors[i].isDead()) meteors.splice(i, 1);
  }
  for (let i = fireworks.length - 1; i >= 0; i--) {
    fireworks[i].update(); fireworks[i].draw(ctx);
    if (fireworks[i].isDead()) fireworks.splice(i, 1);
  }
}
animate();

function handleInteraction(e) {
  let x, y;
  if (e.touches && e.touches.length > 0) {
    x = e.touches[0].clientX; y = e.touches[0].clientY;
    e.preventDefault(); // prevent scroll on mobile
  } else if (e.changedTouches && e.changedTouches.length > 0) {
    x = e.changedTouches[0].clientX; y = e.changedTouches[0].clientY;
  } else {
    x = e.clientX; y = e.clientY;
  }
  if (x == null || y == null) return;
  spawnFirework(x, y);
  for (let i = 0; i < 2; i++) {
    spawnFirework(x + (Math.random() - 0.5) * 80, y + (Math.random() - 0.5) * 80);
  }
}

// ============================================================
// MANIFEST LOADER + SLIDESHOW
// ============================================================
async function loadManifest() {
  let images = [];
  let music = [];
  try {
    const resp = await fetch('manifest.json');
    if (resp.ok) {
      const data = await resp.json();
      images = data.images || [];
      music = data.music || [];
    }
  } catch (e) {}

  // Init slideshow with images
  if (images.length > 0) {
    const imgUrls = images.map(f => {
      const path = f.startsWith('images/') ? f : `images/${f}`;
      const parts = path.split('/');
      parts[parts.length - 1] = encodeURI(parts[parts.length - 1]);
      return parts.join('/');
    });

    let current = 0;
    imgUrls.forEach((src, i) => {
      const slide = document.createElement('div');
      slide.className = 'slide-img';
      if (i === 0) slide.classList.add('active');
      slide.style.backgroundImage = `url(${src})`;
      slideshowStage.insertBefore(slide, slideshowStage.firstChild);

      const bgSlide = document.createElement('div');
      bgSlide.className = 'bg-slide';
      bgSlide.style.cssText = `position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2.5s ease-in-out;`;
      if (i === 0) { bgSlide.classList.add('active'); bgSlide.style.opacity = '0.35'; }
      bgSlide.style.backgroundImage = `url(${src})`;
      document.getElementById('bgCarousel').appendChild(bgSlide);
    });

    const slides = slideshowStage.querySelectorAll('.slide-img');
    const bgSlides = document.getElementById('bgCarousel').querySelectorAll('.bg-slide');
    setInterval(() => {
      slides[current].classList.remove('active');
      bgSlides[current].style.opacity = '0';
      current = (current + 1) % imgUrls.length;
      slides[current].classList.add('active');
      bgSlides[current].style.opacity = '0.35';
    }, 5000);
  }

  // Init music player
  if (music.length > 0) {
    const btn = document.getElementById('musicBtn');
    const playlist = music.map(f => f.startsWith('music/') ? f : `music/${f}`);
    let cur = 0, playing = false;
    const audio = new Audio();
    audio.volume = 0.5;
    audio.preload = 'none';

    function loadTrack(i) { audio.src = playlist[i]; }
    function play() { audio.play().then(() => { playing = true; btn.classList.add('playing'); }).catch(() => {}); }
    function pause() { audio.pause(); playing = false; btn.classList.remove('playing'); }

    btn.addEventListener('click', (e) => { e.stopPropagation(); playing ? pause() : play(); });
    audio.addEventListener('ended', () => { cur = (cur + 1) % playlist.length; loadTrack(cur); play(); });
    audio.addEventListener('error', () => { setTimeout(() => { cur = (cur + 1) % playlist.length; loadTrack(cur); play(); }, 2000); });
    loadTrack(0);

    let started = false;
    function tryStart() { if (started) return; audio.play().then(() => { started = true; playing = true; btn.classList.add('playing'); }).catch(() => {}); }
    document.addEventListener('click', tryStart);
    document.addEventListener('touchstart', tryStart);
  }
}
loadManifest();

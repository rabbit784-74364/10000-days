/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #050510;
  --text-primary: #ffffff;
  --text-secondary: #aab;
  --glow-rainbow: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #ff6bff, #ff6b6b);

body {

/* ============================================================

   ============================================================ */

    radial-gradient(ellipse 80% 60% at 20% 30%, rgba(120, 60, 200, 0.15) 0%, transparent 60%),

/* Slowly rotating light streams */

<script>
// ============================================================
// FIREWORKS SYSTEM (Canvas)
// ============================================================

const canvas = document.getElementById('fireworksCanvas');
const ctx = canvas.getContext('2d');

let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => {
  resize();
  // Re-create starfield on resize
  initStars();
});

// ---- Particle ----
class Particle {
  constructor(x, y, color, options = {}) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = (options.speed || 2) + Math.random() * (options.speedVar || 5);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.color = color;
    this.alpha = 1;
    this.size = options.size || (1.5 + Math.random() * 3);
    this.gravity = options.gravity || 0.04;
    this.fade = options.fade || (0.008 + Math.random() * 0.02);
    this.friction = options.friction || 0.985;
    // Sparkle trail
    this.trail = [];
    this.maxTrail = options.trail || 0;
    this.hue = options.hueShift || 0;
  }

  update() {
    // Save position for trail
    if (this.maxTrail > 0) {
      this.trail.push({ x: this.x, y: this.y, alpha: this.alpha });
      if (this.trail.length > this.maxTrail) this.trail.shift();
    }
    // Physics
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.fade;
    // Update trail alpha
    this.trail.forEach(t => t.alpha -= this.fade * 2);
  }

  draw(ctx) {
    // Draw trail
    if (this.maxTrail > 0) {
      this.trail.forEach(t => {
        if (t.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = t.alpha * 0.4;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(t.x, t.y, this.size * 0.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }
    // Draw main particle
    if (this.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = this.size * 2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  isDead() { return this.alpha <= 0; }
}

// ---- Firework (burst of particles) ----
class Firework {
  constructor(x, y, options = {}) {
    this.particles = [];
    const palette = options.palette || [
      '#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff',
      '#c06bff', '#ff9f43', '#00d2d3', '#ff6bff',
      '#ff8a5c', '#a29bfe', '#fd79a8', '#fdcb6e'
    ];
    const count = options.count || (80 + Math.floor(Math.random() * 60));
    const colors = [];
    // Pick 2-3 dominant colors for this burst
    const domCount = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < domCount; i++) {
      colors.push(palette[Math.floor(Math.random() * palette.length)]);
    }
    for (let i = 0; i < count; i++) {
      const color = colors[Math.floor(Math.random() * colors.length)];
      this.particles.push(new Particle(x, y, color, {
        speed: 3, speedVar: 7,
        size: 1.5 + Math.random() * 3.5,
        gravity: 0.05,
        fade: 0.006 + Math.random() * 0.018,
        trail: Math.random() > 0.5 ? 3 + Math.floor(Math.random() * 4) : 0,
      }));
    }
    // Inner bright core particles
    for (let i = 0; i < 20; i++) {
      const color = '#ffffff';
      this.particles.push(new Particle(x, y, color, {
        speed: 0.5, speedVar: 2,
        size: 0.8 + Math.random() * 1.5,
        gravity: 0.03,
        fade: 0.03 + Math.random() * 0.04,
        trail: 0,
      }));
    }
  }

  update() {
    this.particles = this.particles.filter(p => !p.isDead());
    this.particles.forEach(p => p.update());
  }

  draw(ctx) {
    this.particles.forEach(p => p.draw(ctx));
  }

  isDead() { return this.particles.length === 0; }
}

// ---- Fireworks Manager ----
const fireworks = [];

function spawnFirework(x, y) {
  fireworks.push(new Firework(x, y, { count: 100 + Math.floor(Math.random() * 80) }));
}

function animate() {
  requestAnimationFrame(animate);

  // Semi-transparent clear for trails
  ctx.fillStyle = 'rgba(5, 5, 16, 0.25)';
  ctx.fillRect(0, 0, W, H);

  // Update & draw fireworks
  for (let i = fireworks.length - 1; i >= 0; i--) {
    fireworks[i].update();
    fireworks[i].draw(ctx);
    if (fireworks[i].isDead()) fireworks.splice(i, 1);
  }
}

// ---- Click / Touch handler ----
function handleInteraction(e) {
  e.preventDefault();
  let x, y;
  if (e.touches) {
    x = e.touches[0].clientX;
    y = e.touches[0].clientY;
  } else {
    x = e.clientX;
    y = e.clientY;
  }
  // Spawn 1-3 fireworks at the click point
  const count = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++) {
    const ox = x + (Math.random() - 0.5) * 60;
    const oy = y + (Math.random() - 0.5) * 60;
    spawnFirework(ox, oy);
  }
}

document.addEventListener('click', handleInteraction);
document.addEventListener('touchstart', handleInteraction, { passive: false });

// Start animation
animate();

// ============================================================
// AUTO FIREWORKS ON LOAD
// ============================================================
function autoFireworks() {
  const delay = (ms) => new Promise(r => setTimeout(r, ms));

  async function launch() {
    await delay(600);
    // Center burst
    spawnFirework(W * 0.5, H * 0.35);
    await delay(400);
    spawnFirework(W * 0.3, H * 0.25);
    await delay(300);
    spawnFirework(W * 0.7, H * 0.3);
    await delay(500);
    spawnFirework(W * 0.45, H * 0.4);
    await delay(350);
    spawnFirework(W * 0.55, H * 0.2);
  }
  launch();
}
autoFireworks();

// ============================================================
// FALLING ELEMENTS (Stars, Hearts, Emojis)
// ============================================================
const fallingLayer = document.getElementById('fallingLayer');
const fallingEmojis = [
  '⭐', '✨', '🌟', '💫', '🌙',
  '❤️', '💕', '💖', '💗', '💝',
  '{ }', '</>', ';', '()', '//',
  '✦', '✧', '♡', '◆', '◇',
  '🪐', '🚀', '💻', '🎂', '🎉'
];

function createFallingElement() {
  const el = document.createElement('span');
  el.className = 'falling-item';

  // Remove after animation ends
  const duration = parseFloat(el.style.animationDuration) + parseFloat(el.style.animationDelay);
  setTimeout(() => {
    if (el.parentNode) el.parentNode.removeChild(el);
  }, duration * 1000 + 1000);
}

// Spawn initial batch

// TYPEWRITER EFFECT
// ============================================================
const typewriterEl = document.getElementById('typewriter');
const phrases = [
  '10000天，从 Hello World 到改变世界 🌍',
  '灵魂滚烫，代码成诗 🌊',
  '每一行代码，都是写给未来的情书 💌',
  '热烈地活着，硬核地创造 🚀',
  '一万天，是宇宙的起点，不是终点 ✨',
  'while (alive) { dream(); build(); love(); }',
  'console.log("Hello, 10000 Days!")',
  'git commit -m "10000 days of awesomeness"',
];

let phraseIndex = 0;
let charIndex = 0;
let isDeleting = false;
let typeSpeed = 80;

function typeLoop() {
  const current = phrases[phraseIndex];

  if (!isDeleting) {
    // Typing
    typewriterEl.textContent = current.substring(0, charIndex);
    charIndex++;
    if (charIndex > current.length) {
      // Finished typing — pause then delete
      isDeleting = true;
      typeSpeed = 2000; // Pause at end
    } else {
      typeSpeed = 60 + Math.random() * 60;
    }
  } else {
    // Deleting
    typewriterEl.textContent = current.substring(0, charIndex);
    charIndex--;
    if (charIndex < 0) {
      // Finished deleting — move to next phrase
      isDeleting = false;
      charIndex = 0;
      phraseIndex = (phraseIndex + 1) % phrases.length;
      typeSpeed = 300;
    } else {
      typeSpeed = 30 + Math.random() * 20;
    }
  }

  setTimeout(typeLoop, typeSpeed);
}

// Start typewriter after a slight delay
setTimeout(typeLoop, 1500);

// ============================================================
// BACKGROUND IMAGE CAROUSEL
// ============================================================
(function initBgCarousel() {
  const container = document.getElementById('bgCarousel');
  // Supported image extensions
  const exts = ['.jpg','.jpeg','.png','.webp','.gif','.bmp'];
  const imageFiles = [];
  // Try to load images from the images/ folder
  // We'll probe common filenames, plus the user can add their own

  // Probe images/img-1.jpg, images/img-2.jpg, etc.
  function probeImages(prefix, count, ext) {
    const found = [];
    for (let i = 1; i <= count; i++) {
      const url = `images/${prefix}${i}${ext}`;
      found.push(url);
    }
    return found;
  }

  // Try multiple naming patterns
  const candidates = [
    ...probeImages('img-', 20, '.jpg'),
    ...probeImages('img-', 20, '.png'),
    ...probeImages('img-', 20, '.webp'),
    ...probeImages('photo-', 20, '.jpg'),
    ...probeImages('photo-', 20, '.png'),
    ...probeImages('pic-', 20, '.jpg'),
    ...probeImages('pic-', 20, '.png'),
  ];

  // Test each candidate
  let loaded = 0;
  const validImages = [];

  function testNext(index) {
    if (index >= candidates.length) {
      if (validImages.length > 0) startCarousel(validImages);
      return;
    }
    const img = new Image();
    img.onload = function() {
      validImages.push(candidates[index]);
      testNext(index + 1);
    };
    img.onerror = function() {
      testNext(index + 1);
    };
    img.src = candidates[index];
  }

  testNext(0);

  function startCarousel(images) {
    if (images.length === 0) return;
    let current = 0;

    // Create slide elements
    images.forEach((src, i) => {
      const slide = document.createElement('div');
      slide.className = 'bg-slide';
      slide.style.backgroundImage = `url(${src})`;
      if (i === 0) slide.classList.add('active');
      container.appendChild(slide);
    });

    const slides = container.querySelectorAll('.bg-slide');

    function nextSlide() {
      slides[current].classList.remove('active');
      slides[current].classList.add('exit');
      current = (current + 1) % slides.length;
      slides[current].classList.remove('exit');
      slides[current].classList.add('active');
    }

    // Rotate every 8 seconds
    if (images.length > 1) {
      setInterval(nextSlide, 8000);
    }
  }
})();

// ============================================================
// METEOR SHOWER — Shooting Stars
// ============================================================
(function initMeteorShower() {
  function spawnMeteor() {
    const meteor = document.createElement('div');
    meteor.className = 'meteor';

    // Random position: start from top-left area
    const startX = Math.random() * window.innerWidth * 0.8;
    const startY = Math.random() * window.innerHeight * 0.4;

    // Angle: -25° to -55° (diagonal down-right)
    const angle = -25 - Math.random() * 30;
    const distance = 400 + Math.random() * 600;
    const dx = Math.cos(angle * Math.PI / 180) * distance;
    const dy = Math.sin(angle * Math.PI / 180) * distance * -1;

    // Trail length
    const trailLen = 60 + Math.random() * 140;

    meteor.style.cssText = `
      left: ${startX}px;
      top: ${startY}px;
      --angle: ${angle}deg;
      --dx: ${dx}px;
      --dy: ${dy}px;
      --trail: ${trailLen}px;
      animation-duration: ${0.8 + Math.random() * 1.2}s;
      width: ${1 + Math.random() * 2}px;
      height: ${1 + Math.random() * 2}px;
      box-shadow: 0 0 ${3 + Math.random() * 6}px ${1 + Math.random() * 2}px
        rgba(${200 + Math.random() * 55}, ${200 + Math.random() * 55}, ${230 + Math.random() * 25}, 0.9);
    `;

    document.body.appendChild(meteor);

    // Clean up after animation
    const duration = parseFloat(meteor.style.animationDuration) * 1000;
    setTimeout(() => {
      if (meteor.parentNode) meteor.parentNode.removeChild(meteor);
    }, duration + 100);
  }

  // Initial burst of meteors
  for (let i = 0; i < 5; i++) {
    setTimeout(() => spawnMeteor(), 500 + i * 400);
  }

  // Spawn randomly every 2-6 seconds
  function scheduleNext() {
    const delay = 2000 + Math.random() * 4000;
    setTimeout(() => {
      // Sometimes spawn 2-3 meteors close together (meteor shower burst)
      const burst = Math.random() > 0.7 ? 2 + Math.floor(Math.random() * 2) : 1;
      for (let i = 0; i < burst; i++) {
        setTimeout(() => spawnMeteor(), i * 150);
      }
      scheduleNext();
    }, delay);
  }
  scheduleNext();
})();
